<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Categories - Expense Tracker</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background-color: #f5f7fb;
            color: #333;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 70px;

            background-color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 50px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .logo {

            font-size: 24px;

            font-weight: bold;
        }


        .nav-links {

            display: flex;

            gap: 10px;
        }


        .nav-links a {

            text-decoration: none;

            color: #333;

            padding: 10px 15px;

            border-radius: 6px;
        }


        .nav-links a:hover {

            background-color: #f0f0f0;
        }


        .logout-btn {

            background-color: #e74c3c;

            color: white !important;
        }


        .logout-btn:hover {

            background-color: #c0392b !important;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 90%;

            max-width: 1100px;

            margin: 40px auto;
        }


        .page-heading {

            margin-bottom: 30px;
        }


        .page-heading h1 {

            font-size: 32px;

            margin-bottom: 8px;
        }


        .page-heading p {

            color: #777;

            font-size: 16px;
        }


        /* =========================
           ADD CATEGORY
        ========================= */

        .category-form {

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            margin-bottom: 35px;
        }


        .category-form h2 {

            margin-bottom: 20px;
        }


        .form-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .form-group label {

            margin-bottom: 8px;

            font-weight: bold;
        }


        .form-group input,
        .form-group select {

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }


        .form-group input:focus,
        .form-group select:focus {

            outline: none;

            border-color: #333;
        }


        .add-btn {

            margin-top: 20px;

            padding: 12px 25px;

            background-color: #333;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;
        }


        .add-btn:hover {

            background-color: #555;
        }


        /* =========================
           CATEGORY LIST
        ========================= */

        .categories-section {

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);
        }


        .categories-section h2 {

            margin-bottom: 20px;
        }


        .category-table {

            width: 100%;

            border-collapse: collapse;
        }


        .category-table th,
        .category-table td {

            padding: 15px;

            text-align: left;

            border-bottom: 1px solid #eee;
        }


        .category-table th {

            background-color: #f8f8f8;
        }


        .category-icon {

            font-size: 22px;
        }


        .delete-btn {

            background-color: #e74c3c;

            color: white;

            border: none;

            padding: 8px 14px;

            border-radius: 5px;

            cursor: pointer;
        }


        .delete-btn:hover {

            background-color: #c0392b;
        }


        .no-categories {

            text-align: center;

            color: #777;

            padding: 25px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .navbar {

                padding: 0 20px;
            }


            .nav-links a {

                padding: 8px;

                font-size: 13px;
            }


            .container {

                width: 94%;
            }


            .form-row {

                grid-template-columns: 1fr;
            }
        }

    </style>
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">


        <div class="logo">

            Expense Tracker

        </div>


        <div class="nav-links">


            <a href="Home.html">
                Home
            </a>


            <a href="dashboard.html">
                Dashboard
            </a>


            <a href="expense.html">
                Expenses
            </a>


            <a href="categories.html">
                Categories
            </a>


            <a href="account.html">
                Account
            </a>


            <a href="login.html"
               class="logout-btn"
               onclick="logout()">

                Logout

            </a>


        </div>

    </nav>



    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="container">


        <!-- PAGE HEADING -->

        <div class="page-heading">

            <h1>
                Categories
            </h1>

            <p>
                Create and manage categories for your expenses.
            </p>

        </div>



        <!-- =========================
             ADD CATEGORY FORM
        ========================= -->

        <div class="category-form">


            <h2 id="categoryFormHeading">
                Add Category
            </h2>


            <form id="categoryForm" novalidate>


                <div class="form-row">


                    <!-- CATEGORY NAME -->

                    <div class="form-group">

                        <label for="categoryName">
                            Category Name
                        </label>

                        <input
                            type="text"
                            id="categoryName"
                            placeholder="Example: Food"
                            required
                        >

                    </div>



                    <!-- CATEGORY TYPE -->

                    <div class="form-group">

                        <label for="categoryIcon">
                            Category Icon
                        </label>


                        <select
                            id="categoryIcon"
                            required
                        >

                            <option value="">
                                Select Icon
                            </option>

                            <option value="🍔">
                                🍔 Food
                            </option>

                            <option value="🛍️">
                                🛍️ Shopping
                            </option>

                            <option value="🚗">
                                🚗 Transport
                            </option>

                            <option value="🏠">
                                🏠 Home
                            </option>

                            <option value="💡">
                                💡 Bills
                            </option>

                            <option value="🎬">
                                🎬 Entertainment
                            </option>

                            <option value="🏥">
                                🏥 Health
                            </option>

                            <option value="📚">
                                📚 Education
                            </option>

                            <option value="✈️">
                                ✈️ Travel
                            </option>

                            <option value="📦">
                                📦 Other
                            </option>

                        </select>

                    </div>


                </div>



                <button
                    type="submit"
                    class="add-btn">

                    Add Category

                </button>

                <button
                    type="button"
                    id="cancelCategoryEdit"
                    class="cancel-edit-btn"
                    hidden>

                    Cancel

                </button>

                <p class="form-message"
                   role="status"
                   aria-live="polite"></p>

            </form>


        </div>



        <!-- =========================
             CATEGORY LIST
        ========================= -->

        <div class="categories-section">


            <h2>
                My Categories
            </h2>


            <table class="category-table">


                <thead>

                    <tr>

                        <th>
                            Icon
                        </th>

                        <th>
                            Category Name
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="categoryList">

                    <!-- Categories appear here -->

                </tbody>


            </table>


        </div>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="js/form-feedback.js"></script>
    <script src="js/user-storage.js"></script>
    <script src="js/categories.js"></script>


</body>

</html>
